services:
  - type: worker
    name: chococobot-v5
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: PYTHON_BIN
        value: /app/.venv/bin/python
      - key: DISCORD_TOKEN
        sync: false
      - key: LOGGING_GUILD_ID
        value: 1507058598423826533
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_SYSTEM_PROMPT
        value: >-
          당신은 초코코봇이에요. 짧고 다정한 한국어로 답해요. 명령어 응답처럼 자연스럽게 말해요: 안녕하세요..., 채널에 이미 연결되어 있어요..., 음성 채널에 접속한 상태여야 해요... 느낌표, 물음표, 이모지, 장식 문자는 쓰지 않아요. 문장은 자연스럽게 끝내고, 이미 자연스러운 종결이면 해요나 ...를 접미어처럼 덧붙이지 않아요. 인사만 받으면 안녕하세요...처럼 짧게 답하고, 어떤 도움이 필요하신가요 같은 상담봇 문구는 쓰지 않아요. 한국어 응답에서 봇 이름을 말할 때는 초코코봇이라고 써요. 영어로 묻는 경우에만 ChococoBot 표기를 써도 돼요. 상황에 맞는 자연스러운 답을 만들고, 확실하지 않으면 구체적으로 물어봐요.
      - key: AI_MAX_COMPLETION_TOKENS
        value: 500
      - key: AI_PLANNER_MAX_COMPLETION_TOKENS
        value: 800
      - key: AI_USER_DAILY_TOKEN_LIMIT
        value: 0
      - key: AI_GUILD_DAILY_TOKEN_LIMIT
        value: 180000
      - key: AI_MEMORY_RECENT_TURNS
        value: 4
      - key: AI_MEMORY_COMPACT_AFTER_TURNS
        value: 12
      - key: AI_MEMORY_MAX_SUMMARY_CHARS
        value: 900
      - key: WEB_SEARCH_ENABLED
        value: true
      - key: WEB_SEARCH_PROVIDER
        value: searxng
      - key: WEB_SEARCH_BASE_URL
        value: http://127.0.0.1:8888
      - key: WEB_SEARCH_DEFAULT_MODE
        value: search_first_factual
      - key: WEB_SEARCH_TIMEOUT_MS
        value: 5000
      - key: WEB_SEARCH_RESULT_COUNT
        value: 3
      - key: SEARXNG_PORT
        value: 8888
      - key: SEARXNG_READY_TIMEOUT_SECONDS
        value: 25
      - key: BOT_TIME_ZONE
        value: Asia/Seoul
      - key: DATABASE_PATH
        value: /var/data/chococobot.sqlite3
      - key: CLEAN_MINE_DEFAULT_TARGET
        value: 500
      - key: CLEAN_MINE_MAX_LIMIT
        value: 500
      - key: CLEAN_ALL_DEFAULT_TARGET
        value: 1000
      - key: CLEAN_ALL_MAX_LIMIT
        value: 1000
      - key: VOICE_IDLE_LEAVE_MS
        value: 600000
      - key: TTS_ENGINE
        value: edge
      - key: TTS_VOICE
        value: ko-KR-SunHiNeural
      - key: TTS_MAX_CHARS
        value: 500
      - key: TTS_READ_BOT_MESSAGES
        value: false
      - key: LOG_LEVEL
        value: info
