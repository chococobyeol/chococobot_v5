# Local, private SearXNG config for ChococoBot's in-container web.search tool.
# The service is bound to loopback by scripts/render-start.sh and is not exposed publicly.
use_default_settings: true

general:
  debug: false
  instance_name: "ChococoBot Local SearXNG"
  enable_metrics: false

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  # Overridden by SEARXNG_SECRET when present.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false
  public_instance: false

ui:
  static_use_hash: true
